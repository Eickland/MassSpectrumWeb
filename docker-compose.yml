services:
  msweb:
    build:
      context: .
      additional_contexts:
        # репозиторий HumSpectra (нужен подпакет mass_spectra/pipeline);
        # вместо локальной папки можно указать git: https://github.com/Eickland/HumSpectra.git#main
        humspectra: ${HUMSPECTRA_CONTEXT:-../HumSpectra}
    container_name: MassSpectrumWeb
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data          # БД msweb.sqlite и прежний lab_journal.xlsx
    env_file: .env            # API_KEY, WEB_USER, WEB_PASSWORD (см. .env.example)
    environment:
      - DATA_PATH=/data
      - TZ=Europe/Moscow
    restart: unless-stopped
